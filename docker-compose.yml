# SourceFidelity API – Docker Compose

services:
  api:
    build: .
    container_name: sourcefidelity-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: sourcefidelity-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  redis:
    image: redis:7-alpine
    container_name: sourcefidelity-redis
    restart: unless-stopped
    # Loopback-only: Redis has no auth configured, so never expose it off-host.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: sourcefidelity-postgres
    restart: unless-stopped
    environment:
      # Credentials come from .env (dev defaults preserved if unset). Never
      # hardcode real DB credentials in the compose file (REVIEW §2.6).
      POSTGRES_USER: ${POSTGRES_USER:-sourcefidelity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcefidelity}
      POSTGRES_DB: ${POSTGRES_DB:-sourcefidelity}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sourcefidelity-minio
    restart: unless-stopped
    environment:
      # Same as the app's S3_ACCESS_KEY / S3_SECRET_KEY (see config.py). Override
      # in .env for any non-dev deployment (REVIEW §2.6).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sourcefidelity}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sourcefidelity123}
    ports:
      # S3 API (9000) is needed by the host-side dev app; console (9001) is
      # admin-only. Bind both to loopback so the object store / admin console
      # are not reachable from the network (REVIEW §2.6).
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  redis_data:
  postgres_data:
  minio_data:
