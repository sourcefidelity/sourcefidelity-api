# SourceFidelity API – Docker Compose
version: "3.8"

services:
  api:
    build: .
    container_name: sourcefidelity-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: sourcefidelity-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  redis:
    image: redis:7-alpine
    container_name: sourcefidelity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: sourcefidelity-postgres
    environment:
      POSTGRES_USER: sourcefidelity
      POSTGRES_PASSWORD: sourcefidelity
      POSTGRES_DB: sourcefidelity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcefidelity"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sourcefidelity-minio
    environment:
      MINIO_ROOT_USER: sourcefidelity
      MINIO_ROOT_PASSWORD: sourcefidelity123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  redis_data:
  postgres_data:
  minio_data:
